<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulátor PNP</title><style>body{font:16px system-ui;background:#eef2f5;color:#172535;max-width:1000px;margin:30px auto;padding:16px}section{background:white;padding:20px;border-radius:12px;margin:12px 0}button{padding:12px;margin:5px;border:1px solid #aab7c5;border-radius:8px;background:#fff;cursor:pointer}button:hover{background:#dceaf8}button:disabled{opacity:.45}#monitor{background:#101615;color:#79ff80}canvas{width:100%;height:150px}textarea{width:95%;min-height:55px}small{color:#667}h1,h2{margin-top:0}</style><h1>Simulátor výjezdu ZZS</h1><p>Výukový prototyp • Akutní dušnost • Dospělý pacient</p><section id="dispatch"><h2>Výzva ZOS</h2>Muž, 67 let, náhle vzniklá výrazná dušnost doma. Při vědomí. Posádka RZP.<br><button onclick="start()">Příjezd na místo</button></section><div id="case" hidden><section id="monitor"><div id="vitals"></div><canvas id="ecg" width="900" height="150"></canvas><small>Schematická výuková křivka, nikoli diagnostický záznam.</small></section><section><h2 id="phase"></h2><p id="scene"></p><div id="actions"></div><p id="feedback" aria-live="polite"></p><button id="next" onclick="advance()">Pokračovat →</button></section><section><h2>Záznam výjezdu</h2><div id="log"></div></section><section id="handover" hidden><h2>Předání ATMIST</h2><div id="fields"></div><button onclick="finish()">Vyhodnotit výjezd</button></section><section id="result" hidden></section></div><script>
const $=id=>document.getElementById(id);let stage=0,done=new Set(),log=[],hr=118,spo=83,rr=34,bp='185/105',mon=false,oxygen=false,cpap=false,destination='',ended=false;const stages=[['A – Airways','Pacient sedí v předklonu, mluví po jednotlivých slovech.',[['a','Zhodnotit průchodnost DC','Dýchací cesty průchodné, bez stridoru.']]],['B – Breathing','Výrazná dechová práce, pacient je opocený.',[['b','Vyšetřit dýchání a poslech','Oboustranné vlhké chrůpky, symetrické dýchání, DF 34/min.'],['o','Podat kyslík a titrovat dle SpO₂','Zahájena oxygenoterapie.'],['p','Zvážit a zahájit CPAP dle kompetencí','Pacient spolupracuje, bez zvracení, tlak dostatečný. CPAP toleruje.'],['rv','Vyžádat lékařskou podporu','ZOS informováno o závažné respirační insuficienci.']]],['C – Circulation','Pacient je bledý, periferně opocený.',[['c','Zhodnotit oběh a TK','TK '+bp+', pravidelný rychlý puls, bez známek krvácení.'],['m','Připojit monitor a pulzní oxymetr','Sinusová tachykardie.'],['iv','Zajistit žilní vstup','Periferní žilní vstup zajištěn.']]],['D – Disability','Pacient odpovídá přiměřeně.',[['d','Vyšetřit vědomí a glykemii','GCS 15, glykemie 6,8 mmol/l.']]],['E – Exposure','Bez zjevného traumatu.',[['e','Cíleně vyšetřit pacienta','Oboustranné otoky kotníků, bez horečky.']]],['Sekundární vyšetření','Doplň anamnézu a zhodnoť odpověď na léčbu.',[['h','Odebrat SAMPLE anamnézu','Hypertenze, srdeční selhání, dušnost od 06:20, ortopnoe.'],['k','Pořídit 12svodové EKG','Sinusová tachykardie, bez zjevné elevace ST.'],['r','Opakovat ABCDE','Aktuální stav zobrazen na monitoru.'],['n','Konzultovat vazodilatační léčbu s lékařem','Při hypertenzním plicním edému lze zvážit nitráty po ověření kontraindikací a dle protokolu.']]],['Transport','Vyber cílové pracoviště.',[['u','Urgentní příjem s dostupnou intenzivní péčí','Zvolen urgentní příjem.'],['x','Běžná ambulantní ordinace','Zvolena ambulance.'],['y','Ponechat doma','Zvoleno ponechání doma.']]]];
function start(){$('dispatch').hidden=true;$('case').hidden=false;render();}function update(){ $('vitals').textContent=mon?'TF '+hr+' /min     SpO₂ '+spo+' %     DF '+rr+' /min     TK '+bp:'Monitor nepřipojen';}function render(){let s=stages[stage];$('phase').textContent=s[0];$('scene').textContent=s[1];$('feedback').textContent='';$('actions').replaceChildren();let opts=[...s[2]];if(stage<6){for(let id of ['m','o','p','rv']){let a=stages.flatMap(s=>s[2]).find(a=>a[0]===id);if(!opts.some(b=>b[0]===id))opts.push(a)}}for(let a of opts){let b=document.createElement('button');b.textContent=a[1];b.disabled=done.has(a[0]);b.onclick=()=>act(a);$('actions').append(b)}update()}
function act(a){let [id,label,msg]=a;done.add(id);if(id==='m')mon=true;if(id==='o'){oxygen=true;spo=Math.max(spo,90)}if(id==='p'){cpap=true;spo=95;rr=24;hr=98;bp='155/90'}if(id==='c')msg='TK '+bp+', pravidelný puls, bez známek krvácení.';if(id==='r')msg='TF '+hr+', SpO₂ '+spo+' %, DF '+rr+', TK '+bp;if(['u','x','y'].includes(id))destination=id;log.push(label+' — '+msg);render();$('feedback').textContent=msg;$('log').replaceChildren(...log.map(t=>{let p=document.createElement('p');p.textContent=t;return p}));}
function advance(){if(stage===6){if(!destination){$('feedback').textContent='Nejprve vyber cílové pracoviště.';return}$('next').disabled=true;$('actions').replaceChildren();$('handover').hidden=false;$('handover').scrollIntoView();return}if(stage>=1&&!cpap&&!oxygen){spo=Math.max(75,spo-2);hr+=4;rr+=2}stage++;render()}
const fields=['A – věk','T – čas vzniku','M – mechanismus / charakter obtíží','I – nálezy','S – vitální funkce','T – terapie'];fields.forEach((f,i)=>{let p=document.createElement('p'),l=document.createElement('label'),t=document.createElement('textarea');t.id='f'+i;l.textContent=f;l.htmlFor=t.id;p.append(l,document.createElement('br'),t);$('fields').append(p)});
function finish(){let required=['a','b','o','p','rv','c','m','d','e','h','k','r'];let missing=required.filter(x=>!done.has(x)).map(x=>stages.flatMap(s=>s[2]).find(a=>a[0]===x)[1]);let score=required.length-missing.length+(destination==='u'?1:0);$('result').hidden=false;$('result').replaceChildren();let h=document.createElement('h2');h.textContent='Výsledek: '+score+'/'+(required.length+1);$('result').append(h);for(let t of ['Pravděpodobná diagnóza: akutní kardiální plicní edém.','Opomenuté úkony: '+(missing.join(', ')||'žádné'),destination==='u'?'Cílové pracoviště odpovídá závažnosti stavu.':'Nevhodné cílové pracoviště.','ATMIST: vyplněno '+fields.filter((_,i)=>$('f'+i).value.trim()).length+'/6 polí. Obsah musí posoudit instruktor.','Vzor: 67letý muž, dušnost od 06:20, netraumatická, ortopnoe, oboustranné chrůpky a otoky. Vstupně SpO₂ 83 %, DF 34, TF 118, TK 185/105. Doplň skutečně provedené intervence a aktuální hodnoty.','Prototyp vyžaduje odbornou validaci podle aktuálních doporučení a místních kompetencí.']){let p=document.createElement('p');p.textContent=t;$('result').append(p)}$('result').scrollIntoView()}
let cv=$('ecg'),ctx=cv.getContext('2d');function wave(p){let g=(m,s)=>Math.exp(-Math.pow((p-m)/s,2));return .12*g(.17,.035)-.12*g(.32,.013)+.95*g(.35,.014)-.24*g(.39,.018)+.27*g(.65,.075)}function draw(t){ctx.clearRect(0,0,900,150);ctx.strokeStyle='#233d2e';ctx.lineWidth=1;for(let x=0;x<900;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,150);ctx.stroke()}for(let y=0;y<150;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}if(mon){ctx.strokeStyle='#79ff80';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<900;x++){let p=((x/150+t/1000)*hr/60)%1;let y=90-65*wave(p);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
